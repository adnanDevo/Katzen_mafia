<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats Mafia</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" type="module"></script>
</head>
<body>
    <header>
        <div id="erste">
            <img src="images/cat-mafia-logo.png" alt="rechtbild" id="logoBild">
            <h1>Cat Mafia</h1>
        </div>
        <button id="mitglieder">Clan Area</button>
        <button id="region">Regionen</button>
        <button id="streuner">Streuner Area</button>
        <button id="ClanneuesAnlegen">+ Neuer Clan</button>
        <img src="images/cat-mafia-paw.png" alt="linksbild" id="pfoteBild">
    </header>
    <hr>
    <main>
        <div id="divOben">
            <h2>Unsere Mafia_Katzen</h2>
            <p>Starke Charaktern, Klare Aufgaben, Ein Ziel.</p>
            <p>Hier findest du alle Mitglieder der Cat Mafia - von den treuen Gefolgsleuten</p>
            <P>bis hin zu den einflussriechsten Kapitänen.</P>
        </div>
        <div id="divMitte">
            <span><h3> Mitglieder</h3></span>
            <button id="neuMitglied">+ Neues Mitglied</button>
        </div>
        <div id="kontainer">
        </div>
    </main>
    <hr>
    <footer>
        <p>Good Cats, Bad Businuss.</p>
        <p>Cat Mafia © 2025</p>
    </footer>
</body>
</html>
