<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neues Mitglied</title>
    <link rel="stylesheet" href="styleZwei.css">
    <script src="mainZwei.js" type="module"></script>
</head>

<body>
    <header>
        <div id="erste">
            <img src="images/cat-mafia-logo.png" alt="rechtbild" id="logoBild">
            <h1>Cat Mafia - Neuer Mitglieder</h1>
        </div>
        <button id="mitglieder">Mitglieder</button >
        <button  id="ClanneuesAnlegen">+ Neuer Clan</button >
        <img src="images/cat-mafia-paw.png" alt="linksbild" id="pfoteBild">
    </header>
    <main>
         
        <div id="divMitte">
            <h2>Mitgliedsdaten</h2>
        </div>
        <form id="kontainer">
            <div id="div1" >
                <span>Name</span>
                <span id="stern">*</span>
            </div>
            <input type="text" id="div2" required>
            <div id="div3">
                <span>Rang</span>
                <span id="stern">*</span>
            </div>
            <input type="text" id="div4" required>
            <div id="div5">Spezialgebiet</div>
            <input type="text" id="div6">
            <p>Optional-kann später ergänzt werden.</p>
            <h3 id="vorschauTitel">Vorschau</h3>
            <div id="vorschau">
                <div id="divlinks"></div>
                <div id="divrechts">
                    <p>Dein Bild wird automatisch von unsere IT Experten</p>
                    <p> von FBI Kriminalakten heruntergeladen</p>
                </div>

            </div>
            <button id="anlegen">☠ Mitglied anlegen</button>
        </form>

    </main>
    <hr>
    <footer>
        <p>Good Cats, Bad Businuss.</p>
        <p>Cat Mafia © 2025</p>

    </footer>

</body>

</html>
